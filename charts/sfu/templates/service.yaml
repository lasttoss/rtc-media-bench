apiVersion: v1
kind: Service
metadata:
  name: {{ include "sfu.fullname" . }}
  labels:
    {{- include "sfu.labels" . | nindent 4 }}
spec:
  # Signalling is an ordinary HTTP/websocket service and a Service handles it perfectly.
  type: {{ .Values.service.type }}
  selector:
    {{- include "sfu.selectorLabels" . | nindent 4 }}
  ports:
    - name: ws
      port: {{ .Values.service.wsPort }}
      targetPort: ws
      protocol: TCP
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort.ws }}
      {{- end }}
    {{- if eq .Values.exposure "nodePort" }}
    # Media through a Service. It looks reasonable and it is the third fault in the lab: the SFU
    # tells the peer to use the container port, the Service listens on a different one, and ICE
    # fails while the pod stays Ready and the signalling socket stays up.
    - name: ice-udp
      port: {{ .Values.ice.muxPort }}
      targetPort: ice-udp
      protocol: UDP
      nodePort: {{ .Values.service.nodePort.ice }}
    {{- if .Values.ice.tcpFallback }}
    - name: ice-tcp
      port: {{ .Values.ice.tcpPort }}
      targetPort: ice-tcp
      protocol: TCP
      nodePort: {{ .Values.service.nodePort.iceTCP }}
    {{- end }}
    {{- end }}
